
<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ScrumPoker Online</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #111827;
  color: #f9fafb;
  text-align: center;
}

.container {
  max-width: 600px;
  margin: auto;
}

h1 {
  font-size: 25px;
  margin-bottom: 25px;
}

#nome {
  width: 100%;
  padding: 12px;
  font-size: 17px;
  border-radius: 8px;
  border: 1px solid #4b5563;
  background: #1f2937;
  color: white;
  text-align: center;
  margin-bottom: 20px;
}

.opcoes {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.opcao {
  padding: 20px 10px;
  font-size: 24px;
  font-weight: bold;
  border: 2px solid #374151;
  border-radius: 10px;
  background: #1f2937;
  color: white;
  cursor: pointer;
  transition: 0.15s;
}

.opcao:hover:not(:disabled) {
  background: #374151;
}

.opcao.selecionada {
  background: #2563eb;
  border-color: #60a5fa;
}

.opcao:disabled {
  opacity: 0.5;
  cursor: default;
}

.status {
  margin: 20px 0;
  color: #9ca3af;
  font-size: 14px;
}

/* Participantes */

.participantes {
  margin-top: 20px;
  padding: 15px;
  background: #1f2937;
  border-radius: 12px;
  text-align: left;
}

.participantes h2 {
  font-size: 18px;
  text-align: center;
  margin-top: 0;
  margin-bottom: 15px;
}

.participante {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 5px;
  border-bottom: 1px solid #374151;
  gap: 12px;
}

.participante:last-child {
  border-bottom: none;
}

.participante-nome {
  overflow-wrap: anywhere;
}

.participante-voto {
  font-size: 18px;
  font-weight: bold;
  min-width: 30px;
  text-align: center;
  color: #60a5fa;
}

.sem-participantes {
  color: #9ca3af;
  text-align: center;
  padding: 10px;
}

/* Botões */

.botoes {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 25px;
}

button.acao {
  padding: 15px;
  font-size: 16px;
  font-weight: bold;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

#mostrar {
  background: #16a34a;
  color: white;
}

#limpar {
  background: #dc2626;
  color: white;
}

/* Resultados */

.resultados {
  margin-top: 30px;
  padding: 20px;
  background: #1f2937;
  border-radius: 12px;
  display: none;
}

.resultados h2 {
  margin-top: 0;
}

#media {
  font-size: 42px;
  font-weight: bold;
  color: #4ade80;
  margin: 15px 0;
}

#detalhes {
  font-size: 15px;
  line-height: 1.8;
  overflow-wrap: anywhere;
}

.aviso {
  margin-top: 15px;
  color: #9ca3af;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

<h1>ScrumPoker Online</h1>

<input
  type="text"
  id="nome"
  maxlength="30"
  placeholder="Seu nome"
  autocomplete="nickname"
/>

<div class="opcoes" id="opcoes"></div>

<div class="status" id="status">
  Conectando...
</div>

<!-- Participantes online -->

<div class="participantes">

  <h2>Participantes online</h2>

  <div id="listaParticipantes">
    Aguardando conexão...
  </div>

</div>

<!-- Ações -->

<div class="botoes">

  <button class="acao" id="mostrar">
    Mostrar resultados
  </button>

  <button class="acao" id="limpar">
    Limpar resultados
  </button>

</div>

<!-- Resultados -->

<div class="resultados" id="resultados">

  <h2>Resultados da votação</h2>

  <div id="media">--</div>

  <div id="detalhes"></div>

</div>

<div class="aviso">
  Os votos permanecem secretos até a revelação.
</div>

</div>


<script type="module">

/* =========================================
   FIREBASE IMPORTS
========================================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  get,
  update,
  onValue,
  onDisconnect
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

import {
  getAuth,
  signInAnonymously
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";


/* =========================================
   CONFIGURAÇÃO DO FIREBASE

   Substitua pelos dados do seu projeto.
========================================= */

const firebaseConfig = {

  apiKey: "SUA_API_KEY",

  authDomain: "SEU_PROJETO.firebaseapp.com",

  databaseURL:
    "https://SEU_PROJETO-default-rtdb.firebaseio.com",

  projectId: "SEU_PROJETO",

  appId: "SEU_APP_ID"

};


/* =========================================
   INICIALIZAÇÃO
========================================= */

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const auth = getAuth(app);


/* =========================================
   REFERÊNCIAS DO BANCO
========================================= */

const salaRef =
  ref(db, "votacaoFibonacci");

const votosRef =
  ref(db, "votacaoFibonacci/votos");

const presencaRef =
  ref(db, "votacaoFibonacci/presenca");

const estadoRef =
  ref(db, "votacaoFibonacci/revelado");


/* =========================================
   ELEMENTOS HTML
========================================= */

const campoNome =
  document.getElementById("nome");

const opcoesDiv =
  document.getElementById("opcoes");

const statusDiv =
  document.getElementById("status");

const listaParticipantes =
  document.getElementById("listaParticipantes");

const resultadosDiv =
  document.getElementById("resultados");

const mediaDiv =
  document.getElementById("media");

const detalhesDiv =
  document.getElementById("detalhes");

const botaoMostrar =
  document.getElementById("mostrar");

const botaoLimpar =
  document.getElementById("limpar");


/* =========================================
   SEQUÊNCIA DE FIBONACCI
========================================= */

const fibonacci = [
  1, 2, 3, 5, 8, 13, 21, 34, 55, "?"
];


/* =========================================
   VARIÁVEIS
========================================= */

let uid = null;

let votoAtual = null;

let revelado = false;

let votos = {};

let participantes = {};

let conectado = false;


/* =========================================
   NOME ALEATÓRIO
========================================= */

function gerarNome() {

  const adjetivos = [
    "Azul",
    "Verde",
    "Vermelho",
    "Dourado",
    "Sereno",
    "Brilhante",
    "Cósmico",
    "Solar",
    "Lunar",
    "Radiante",
    "Infinito",
    "Curioso",
    "Místico",
    "Veloz",
    "Tranquilo"
  ];

  const substantivos = [
    "Gato",
    "Lobo",
    "Águia",
    "Cometa",
    "Planeta",
    "Estrela",
    "Fênix",
    "Dragão",
    "Panda",
    "Tigre",
    "Golfinho",
    "Oráculo",
    "Viajante",
    "Explorador",
    "Guardião"
  ];

  const a =
    adjetivos[
      Math.floor(Math.random() * adjetivos.length)
    ];

  const b =
    substantivos[
      Math.floor(Math.random() * substantivos.length)
    ];

  const n =
    Math.floor(Math.random() * 900) + 100;

  return `${a} ${b} ${n}`;

}


/* =========================================
   NOME SALVO NO NAVEGADOR
========================================= */

const nomeSalvo =
  localStorage.getItem("nomeFibonacci");

campoNome.value =
  nomeSalvo || gerarNome();


/* =========================================
   CRIAR BOTÕES DE VOTAÇÃO
========================================= */

fibonacci.forEach(numero => {

  const botao = document.createElement("button");

  botao.className = "opcao";

  botao.textContent = numero;

  botao.dataset.valor = numero;

  botao.addEventListener("click", () => {

    if (!conectado || revelado) return;

    registrarVoto(numero);

  });

  opcoesDiv.appendChild(botao);

});


/* =========================================
   ATUALIZAR BOTÕES
========================================= */

function atualizarOpcoes() {

  document.querySelectorAll(".opcao").forEach(botao => {

    const valor = botao.dataset.valor;

    botao.classList.toggle(
      "selecionada",
      String(votoAtual) === valor
    );

    botao.disabled =
      !conectado || revelado;

  });

}


/* =========================================
   REGISTRAR OU ALTERAR VOTO
========================================= */

async function registrarVoto(numero) {

  if (!uid || revelado) return;

  votoAtual = numero;

  atualizarOpcoes();

  const nome =
    campoNome.value.trim() || "Anônimo";

  try {

    /*
      Salva o voto individual.
    */

    await set(
      ref(db, `votacaoFibonacci/votos/${uid}`),
      {
        nome: nome,
        voto: numero
      }
    );

    /*
      Atualiza o indicador público de voto.
      O valor do voto permanece secreto.
    */

    await update(
      ref(db, `votacaoFibonacci/presenca/${uid}`),
      {
        nome: nome,
        votou: true
      }
    );

  } catch (erro) {

    console.error("Erro ao votar:", erro);

    statusDiv.textContent =
      "Erro ao registrar o voto.";

  }

}


/* =========================================
   AUTENTICAÇÃO ANÔNIMA
========================================= */

try {

  const credencial =
    await signInAnonymously(auth);

  uid = credencial.user.uid;

  conectado = true;

  statusDiv.textContent =
    "Conectado. Escolha seu número.";

  iniciarPresenca();

  observarVotos();

  observarEstado();

  observarParticipantes();

} catch (erro) {

  console.error(
    "Erro na autenticação:",
    erro
  );

  statusDiv.textContent =
    "Falha de conexão. Atualize a página.";

}


/* =========================================
   PRESENÇA ONLINE
========================================= */

async function iniciarPresenca() {

  if (!uid) return;

  const minhaPresencaRef =
    ref(db, `votacaoFibonacci/presenca/${uid}`);

  /*
    O Firebase remove a presença automaticamente
    quando a conexão for encerrada.
  */

  await onDisconnect(minhaPresencaRef).remove();

  /*
    Recupera o estado do voto, caso a pessoa
    recarregue a página.
  */

  const meuVotoRef =
    ref(db, `votacaoFibonacci/votos/${uid}`);

  const snapshot =
    await get(meuVotoRef);

  const votou =
    snapshot.exists();

  await set(minhaPresencaRef, {

    nome: campoNome.value,

    votou: votou,

    online: true

  });

  /*
    Alteração do nome em tempo real.
  */

  campoNome.addEventListener("input", async () => {

    const nome =
      campoNome.value.trim() || "Anônimo";

    localStorage.setItem(
      "nomeFibonacci",
      nome
    );

    if (!uid) return;

    try {

      await update(minhaPresencaRef, {

        nome: nome

      });

      /*
        Atualiza também o nome do voto,
        sem alterar o número escolhido.
      */

      const votoRef =
        ref(db, `votacaoFibonacci/votos/${uid}`);

      const votoSnapshot =
        await get(votoRef);

      if (votoSnapshot.exists()) {

        await update(votoRef, {

          nome: nome

        });

      }

    } catch (erro) {

      console.error(
        "Erro ao atualizar nome:",
        erro
      );

    }

  });

}


/* =========================================
   MONITORAR VOTOS
========================================= */

function observarVotos() {

  onValue(votosRef, snapshot => {

    votos = snapshot.val() || {};

    if (uid && votos[uid]) {

      votoAtual = votos[uid].voto;

    } else {

      votoAtual = null;

    }

    atualizarOpcoes();

    atualizarStatus();

    atualizarListaParticipantes();

    if (revelado) {

      calcularResultados();

    }

  });

}


/* =========================================
   MONITORAR ESTADO DA VOTAÇÃO
========================================= */

function observarEstado() {

  onValue(estadoRef, snapshot => {

    revelado =
      snapshot.val() === true;

    atualizarOpcoes();

    atualizarStatus();

    atualizarListaParticipantes();

    if (revelado) {

      calcularResultados();

    } else {

      resultadosDiv.style.display =
        "none";

    }

  });

}


/* =========================================
   MONITORAR PARTICIPANTES ONLINE
========================================= */

function observarParticipantes() {

  onValue(presencaRef, snapshot => {

    participantes =
      snapshot.val() || {};

    atualizarListaParticipantes();

    atualizarStatus();

  });

}


/* =========================================
   ATUALIZAR LISTA DE PARTICIPANTES
========================================= */

function atualizarListaParticipantes() {

  listaParticipantes.innerHTML = "";

  const lista = Object.entries(participantes)
    .map(([id, dados]) => {

      let exibicaoVoto = "-";

      if (revelado) {

        const voto =
          votos[id]?.voto;

        exibicaoVoto =
          voto !== undefined ? voto : "-";

      } else {

        exibicaoVoto =
          dados.votou === true ? "*" : "-";

      }

      return {

        id: id,

        nome: dados.nome || "Anônimo",

        voto: exibicaoVoto

      };

    })
    .sort((a, b) =>
      a.nome.localeCompare(b.nome, "pt-BR")
    );

  if (lista.length === 0) {

    listaParticipantes.innerHTML =
      '<div class="sem-participantes">Nenhum participante online</div>';

    return;

  }

  lista.forEach(participante => {

    const linha =
      document.createElement("div");

    linha.className =
      "participante";

    const nome =
      document.createElement("span");

    nome.className =
      "participante-nome";

    nome.textContent =
      participante.nome;

    const voto =
      document.createElement("span");

    voto.className =
      "participante-voto";

    voto.textContent =
      participante.voto;

    linha.appendChild(nome);

    linha.appendChild(voto);

    listaParticipantes.appendChild(linha);

  });

}


/* =========================================
   ATUALIZAR STATUS
========================================= */

function atualizarStatus() {

  const quantidadeVotos =
    Object.values(participantes)
      .filter(p => p.votou === true)
      .length;

  const quantidadeOnline =
    Object.keys(participantes).length;

  if (revelado) {

    statusDiv.textContent =
      `Votação revelada. ${quantidadeOnline} participante(s) online.`;

  } else {

    statusDiv.textContent =
      `Votação secreta. ${quantidadeVotos} voto(s) de ${quantidadeOnline} participante(s) online.`;

  }

}


/* =========================================
   MOSTRAR RESULTADOS
========================================= */

botaoMostrar.addEventListener("click", async () => {

  if (!conectado) return;

  try {

    await set(estadoRef, true);

  } catch (erro) {

    console.error(erro);

    statusDiv.textContent =
      "Erro ao revelar os resultados.";

  }

});


/* =========================================
   LIMPAR RESULTADOS E REINICIAR
========================================= */

botaoLimpar.addEventListener("click", async () => {

  if (!conectado) return;

  const confirmar = confirm(
    "Deseja apagar todos os votos e reiniciar a votação?"
  );

  if (!confirmar) return;

  try {

    /*
      Limpa os votos e volta ao modo secreto.
      Os participantes continuam conectados.
    */

    await update(
      ref(db),
      {
        "votacaoFibonacci/votos": null,

        "votacaoFibonacci/revelado": false
      }
    );

    /*
      Zera os indicadores públicos de voto.
    */

    const atualizacoes = {};

    Object.keys(participantes).forEach(id => {

      atualizacoes[
        `votacaoFibonacci/presenca/${id}/votou`
      ] = false;

    });

    if (Object.keys(atualizacoes).length > 0) {

      await update(
        ref(db),
        atualizacoes
      );

    }

    votoAtual = null;

    atualizarOpcoes();

    resultadosDiv.style.display =
      "none";

  } catch (erro) {

    console.error(
      "Erro ao limpar:",
      erro
    );

    statusDiv.textContent =
      "Erro ao reiniciar a votação.";

  }

});


/* =========================================
   CALCULAR RESULTADOS
========================================= */

function calcularResultados() {

  const lista =
    Object.values(votos);

  const numericos =
    lista
      .map(item => Number(item.voto))
      .filter(numero =>
        Number.isFinite(numero)
      );

  const quantidade =
    numericos.length;

  resultadosDiv.style.display =
    "block";

  if (quantidade === 0) {

    mediaDiv.textContent =
      "Sem votos numéricos";

    detalhesDiv.textContent =
      `Total de votos: ${lista.length}`;

    return;

  }

  const soma =
    numericos.reduce(
      (total, numero) =>
        total + numero,
      0
    );

  const media =
    soma / quantidade;

  mediaDiv.textContent =
    media.toLocaleString(
      "pt-BR",
      {
        maximumFractionDigits: 4
      }
    );

  /*
    Distribuição de votos.
  */

  const contagem = {};

  lista.forEach(item => {

    const valor =
      String(item.voto);

    contagem[valor] =
      (contagem[valor] || 0) + 1;

  });

  const distribuicao =
    Object.entries(contagem)
      .map(([valor, qtd]) =>
        `${valor}: ${qtd}`
      )
      .join(" | ");

  detalhesDiv.innerHTML = `
    <p>Votos numéricos: ${quantidade}</p>
    <p>Abstenções (?): ${contagem["?"] || 0}</p>
    <p>Total de votos: ${lista.length}</p>
    <p>Distribuição: ${distribuicao}</p>
  `;

}

</script>

</body>
</html>
