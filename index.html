<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="https://scrumpoker-online.github.io/win.png">
<title>ScrumPoker Online</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #111827;
  color: #f9fafb;
  text-align: center;
}

.container {
  max-width: 600px;
  margin: auto;
}

h1 {
  font-size: 25px;
  margin-bottom: 25px;
}

#nomeSalaLink {
  color: #93c5fd;
  cursor: pointer;
  text-decoration: underline;
  text-decoration-style: dotted;
  text-underline-offset: 4px;
}

#modalSala {
  width: min(90%, 380px);
  border: 1px solid #4b5563;
  border-radius: 12px;
  padding: 22px;
  background: #1f2937;
  color: #f9fafb;
}

#modalSala::backdrop { background: rgb(0 0 0 / 70%); }
#modalSala h2 { margin-top: 0; font-size: 20px; }
#novoNomeSala {
  width: 100%; padding: 12px; font-size: 16px;
  border: 1px solid #4b5563; border-radius: 8px;
  background: #111827; color: white;
}
.modal-acoes { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
.modal-acoes button {
  padding: 10px 16px; border: 0; border-radius: 7px;
  font-size: 15px; font-weight: bold; cursor: pointer;
}
#confirmarSala { background: #16a34a; color: white; }
#cancelarSala { background: #4b5563; color: white; }

#nome {
  width: 100%;
  padding: 12px;
  font-size: 17px;
  border-radius: 8px;
  border: 1px solid #4b5563;
  background: #1f2937;
  color: white;
  text-align: center;
  margin-bottom: 20px;
}

.opcoes {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.opcao {
  padding: 20px 10px;
  font-size: 24px;
  font-weight: bold;
  border: 2px solid #374151;
  border-radius: 10px;
  background: #1f2937;
  color: white;
  cursor: pointer;
  transition: 0.15s;
}

.opcao:hover:not(:disabled) {
  background: #374151;
}

.opcao.selecionada {
  background: #2563eb;
  border-color: #60a5fa;
}

.opcao:disabled {
  opacity: 0.5;
  cursor: default;
}

.status {
  margin: 20px 0;
  color: #9ca3af;
  font-size: 14px;
}

/* Participantes */

.participantes {
  margin-top: 20px;
  padding: 15px;
  background: #1f2937;
  border-radius: 12px;
  text-align: left;
}

.participantes h2 {
  font-size: 18px;
  text-align: center;
  margin-top: 0;
  margin-bottom: 15px;
}

.participante {
  display: flex;
  justify-content: flex-start;
  align-items: center;
  padding: 10px 5px;
  border-bottom: 1px solid #374151;
  gap: 12px;
}

.participante:last-child {
  border-bottom: none;
}

.participante-nome {
  overflow-wrap: anywhere;
}

.participante-voto {
  font-size: 18px;
  font-weight: bold;
  min-width: 30px;
  text-align: center;
  color: #60a5fa;
}

.sem-participantes {
  color: #9ca3af;
  text-align: center;
  padding: 10px;
}

/* Botões */

.botoes {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 25px;
}

button.acao {
  padding: 15px;
  font-size: 16px;
  font-weight: bold;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

#mostrar {
  background: #16a34a;
  color: white;
}

#limpar {
  background: #dc2626;
  color: white;
}

/* Resultados */

.resultados {
  margin-top: 30px;
  padding: 20px;
  background: #1f2937;
  border-radius: 12px;
  display: none;
}

.resultados h2 {
  margin-top: 0;
}

#resultadoArredondado {
  font-size: 28px;
  font-weight: bold;
  color: #4ade80;
  margin: 8px 0 14px;
}

#media {
  font-size: 17px;
  color: #f9fafb;
  margin: 8px 0;
}

.aviso {
  margin-top: 15px;
  color: #9ca3af;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

<h1 id="titulo">ScrumPoker Online - <span id="nomeSalaLink" title="Alterar sala">#geral</span></h1>

<dialog id="modalSala">
  <form id="formSala">
    <h2>Entrar em outra sala</h2>
    <input id="novoNomeSala" type="text" maxlength="60" placeholder="Nome da sala" autocomplete="off" required>
    <div class="modal-acoes">
      <button type="button" id="cancelarSala">Cancelar</button>
      <button type="submit" id="confirmarSala">OK</button>
    </div>
  </form>
</dialog>

<input
  type="text"
  id="nome"
  maxlength="30"
  placeholder="Seu nome"
  autocomplete="nickname"
/>

<div class="opcoes" id="opcoes"></div>

<div class="status" id="status">
  Conectando...
</div>

<!-- Participantes online -->

<div class="participantes">

  <h2>Participantes online</h2>

  <div id="listaParticipantes">
    Aguardando conexão...
  </div>

</div>

<!-- Resultados -->

<div class="resultados" id="resultados">
  <div id="resultadoArredondado">Resultado da Votação: --</div>
  <div id="media">Média da Votação: --</div>
</div>

<!-- Ações -->

<div class="botoes">

  <button class="acao" id="mostrar">
    Mostrar votação
  </button>

  <button class="acao" id="limpar">
    Limpar resultados
  </button>

</div>

<div class="aviso">
  Os votos permanecem secretos até a revelação.
</div>

</div>


<script type="module">

/* =========================================
   FIREBASE IMPORTS
========================================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  get,
  update,
  onValue,
  onDisconnect
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

import {
  getAuth,
  signInAnonymously
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";


/* =========================================
   CONFIGURAÇÃO DO FIREBASE

   Substitua pelos dados do seu projeto.
========================================= */
const firebaseConfig = {
  apiKey: "AIzaSyD1_AgFOI5m73yhP6NbEUizl5QkmOUsOWE",
  authDomain: "scrumpoker-45c00.firebaseapp.com",
  databaseURL: "https://scrumpoker-45c00-default-rtdb.firebaseio.com",
  projectId: "scrumpoker-45c00",
  appId: "1:185981243865:web:7eaef045b0533a6c1b49c8",
  messagingSenderId: "185981243865",
  measurementId: "G-JZESNN0VYV"
};
  

/* =========================================
   INICIALIZAÇÃO
========================================= */

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const auth = getAuth(app);


/* =========================================
   SALA E REFERÊNCIAS DINÂMICAS DO BANCO
========================================= */
function normalizarNomeSala(valor) {
  return (valor || "geral").trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9_-]/g, "-").replace(/-+/g, "-")
    .replace(/^-|-$/g, "") || "geral";
}

let salaNome = normalizarNomeSala(decodeURIComponent(location.hash.slice(1)));
let caminhoSala, salaRef, votosRef, presencaRef, estadoRef, rodadaRef;
let pararObservacaoEstado = null;
let pararObservacaoRodada = null;
let pararObservacaoParticipantes = null;
let pararObservacaoVotos = null;
let geracaoSala = 0;
let minhaPresencaRefAtual = null;

function atualizarTituloSala() {
  document.getElementById("nomeSalaLink").textContent = `#${salaNome}`;
}

if (location.hash.slice(1) !== salaNome) {
  history.replaceState(null, "", `${location.pathname}${location.search}#${salaNome}`);
}

/* =========================================
   ELEMENTOS HTML
========================================= */

const campoNome =
  document.getElementById("nome");

const opcoesDiv =
  document.getElementById("opcoes");

const statusDiv =
  document.getElementById("status");

const listaParticipantes =
  document.getElementById("listaParticipantes");

const resultadosDiv =
  document.getElementById("resultados");

const mediaDiv =
  document.getElementById("media");

const resultadoArredondadoDiv =
  document.getElementById("resultadoArredondado");

const botaoMostrar =
  document.getElementById("mostrar");

const botaoLimpar =
  document.getElementById("limpar");

const nomeSalaLink = document.getElementById("nomeSalaLink");
const modalSala = document.getElementById("modalSala");
const formSala = document.getElementById("formSala");
const novoNomeSala = document.getElementById("novoNomeSala");


/* =========================================
   SEQUÊNCIA DE FIBONACCI
========================================= */

const fibonacci = [
  1, 2, 3, 5, 8, 13, 21, 34, 55, "?"
];


/* =========================================
   VARIÁVEIS
========================================= */

let uid = null;

let votoAtual = null;

let revelado = false;
let rodadaAtual = 0;

let votos = {};

let participantes = {};

let conectado = false;


/* =========================================
   NOME ALEATÓRIO
========================================= */

function gerarNome() {

  const adjetivos = [
    "Azul",
    "Verde",
    "Vermelho",
    "Dourado",
    "Sereno",
    "Brilhante",
    "Cósmico",
    "Solar",
    "Lunar",
    "Radiante",
    "Infinito",
    "Curioso",
    "Místico",
    "Veloz",
    "Tranquilo"
  ];

  const substantivos = [
    "Gato",
    "Lobo",
    "Águia",
    "Cometa",
    "Planeta",
    "Estrela",
    "Fênix",
    "Dragão",
    "Panda",
    "Tigre",
    "Golfinho",
    "Oráculo",
    "Viajante",
    "Explorador",
    "Guardião"
  ];

  const a =
    adjetivos[
      Math.floor(Math.random() * adjetivos.length)
    ];

  const b =
    substantivos[
      Math.floor(Math.random() * substantivos.length)
    ];

  const n =
    Math.floor(Math.random() * 900) + 100;

  return `${a} ${b} ${n}`;

}


/* =========================================
   NOME SALVO NO NAVEGADOR
========================================= */

const nomeSalvo =
  localStorage.getItem("nomeFibonacci");

campoNome.value =
  nomeSalvo || gerarNome();


/* =========================================
   CRIAR BOTÕES DE VOTAÇÃO
========================================= */

fibonacci.forEach(numero => {

  const botao = document.createElement("button");

  botao.className = "opcao";

  botao.textContent = numero;

  botao.dataset.valor = numero;

  botao.addEventListener("click", () => {

    if (!conectado) return;

    registrarVoto(numero);

  });

  opcoesDiv.appendChild(botao);

});


/* =========================================
   ATUALIZAR BOTÕES
========================================= */

function atualizarOpcoes() {

  document.querySelectorAll(".opcao").forEach(botao => {

    const valor = botao.dataset.valor;

    botao.classList.toggle(
      "selecionada",
      String(votoAtual) === valor
    );

    botao.disabled =
      !conectado;

  });

}


/* =========================================
   REGISTRAR OU ALTERAR VOTO
========================================= */

async function registrarVoto(numero) {

  if (!uid) return;

  votoAtual = numero;

  atualizarOpcoes();

  const nome =
    campoNome.value.trim() || "Anônimo";

  try {

    /*
      Salva o voto individual.
    */

    await set(
      ref(db, `${caminhoSala}/votos/${uid}`),
      {
        nome: nome,
        voto: numero
      }
    );

    /*
      Atualiza o indicador público de voto.
      O valor do voto permanece secreto.
    */

    await update(
      ref(db, `${caminhoSala}/presenca/${uid}`),
      {
        nome: nome,
        votou: true,
        rodada: rodadaAtual
      }
    );

  } catch (erro) {

    console.error("Erro ao votar:", erro);

    statusDiv.textContent =
      "Erro ao registrar o voto.";

  }

}


/* =========================================
   AUTENTICAÇÃO ANÔNIMA
========================================= */

try {

  const credencial =
    await signInAnonymously(auth);

  uid = credencial.user.uid;

  conectado = true;

  statusDiv.textContent =
    "Conectado. Escolha seu número.";

  await configurarSala(salaNome);

} catch (erro) {

  console.error(
    "Erro na autenticação:",
    erro
  );

  statusDiv.textContent =
    "Falha de conexão. Atualize a página.";

}


// Atualiza o nome no navegador e na presença da sala ativa.
campoNome.addEventListener("input", async () => {
  const nome = campoNome.value.trim() || "Anônimo";
  localStorage.setItem("nomeFibonacci", nome);
  if (!uid || !minhaPresencaRefAtual) return;
  try {
    await update(minhaPresencaRefAtual, { nome });
  } catch (erro) {
    console.error("Erro ao atualizar nome:", erro);
  }
});

/* =========================================
   TROCA DE SALA SEM RECARREGAR A PÁGINA
========================================= */
async function configurarSala(nome) {
  const geracao = ++geracaoSala;
  minhaPresencaRefAtual = null;
  const salaAnteriorPresenca = presencaRef && uid
    ? ref(db, `${caminhoSala}/presenca/${uid}`) : null;

  // Encerra os listeners da sala anterior.
  [pararObservacaoVotos, pararObservacaoEstado,
   pararObservacaoRodada, pararObservacaoParticipantes].forEach(parar => {
    if (parar) parar();
  });
  pararObservacaoVotos = pararObservacaoEstado = null;
  pararObservacaoRodada = pararObservacaoParticipantes = null;

  if (salaAnteriorPresenca) {
    try {
      await onDisconnect(salaAnteriorPresenca).cancel();
      await set(salaAnteriorPresenca, null);
    } catch (erro) {
      console.warn("Não foi possível encerrar a presença na sala anterior:", erro);
    }
  }
  if (geracao !== geracaoSala) return;

  salaNome = nome;
  caminhoSala = `salas/${salaNome}/votacaoFibonacci`;
  salaRef = ref(db, caminhoSala);
  votosRef = ref(db, `${caminhoSala}/votos`);
  presencaRef = ref(db, `${caminhoSala}/presenca`);
  estadoRef = ref(db, `${caminhoSala}/revelado`);
  rodadaRef = ref(db, `${caminhoSala}/rodada`);
  atualizarTituloSala();

  votoAtual = null;
  revelado = false;
  rodadaAtual = 0;
  votos = {};
  participantes = {};
  resultadosDiv.style.display = "none";
  listaParticipantes.textContent = "Conectando à sala...";
  atualizarOpcoes();

  if (!uid) return;
  const minhaPresencaRef = ref(db, `${caminhoSala}/presenca/${uid}`);
  minhaPresencaRefAtual = minhaPresencaRef;
  await iniciarPresenca(geracao, minhaPresencaRef, rodadaRef);
  if (geracao !== geracaoSala) return;

  observarVotos();
  observarEstado();
  observarRodada();
  observarParticipantes();
  atualizarOpcoes();
}

window.addEventListener("hashchange", () => {
  const nome = normalizarNomeSala(decodeURIComponent(location.hash.slice(1)));
  if (location.hash.slice(1) !== nome) {
    history.replaceState(null, "", `${location.pathname}${location.search}#${nome}`);
  }
  if (nome !== salaNome) configurarSala(nome);
});

nomeSalaLink.addEventListener("click", () => {
  novoNomeSala.value = salaNome;
  modalSala.showModal();
  novoNomeSala.focus();
  novoNomeSala.select();
});

document.getElementById("cancelarSala").addEventListener("click", () => {
  modalSala.close();
});

formSala.addEventListener("submit", event => {
  event.preventDefault();
  const novaSala = normalizarNomeSala(novoNomeSala.value);
  modalSala.close();
  if (novaSala !== salaNome) location.hash = novaSala;
});

/* =========================================
   PRESENÇA ONLINE
========================================= */

async function iniciarPresenca(geracao, referenciaPresenca, referenciaRodada) {

  if (!uid) return;

  const minhaPresencaRef = referenciaPresenca;

  const rodadaSnapshot = await get(referenciaRodada);
  if (geracao !== geracaoSala) return;
  rodadaAtual = Number(rodadaSnapshot.val() || 0);

  /*
    O Firebase remove a presença automaticamente
    quando a conexão for encerrada.
  */

  await onDisconnect(minhaPresencaRef).remove();
  if (geracao !== geracaoSala) return;

  // Recupera o indicador de voto da rodada atual sem ler
  // os votos secretos dos demais participantes.
  const presencaSnapshot = await get(minhaPresencaRef);
  if (geracao !== geracaoSala) return;
  const presencaAnterior = presencaSnapshot.val() || {};
  const votou =
    presencaAnterior.votou === true &&
    Number(presencaAnterior.rodada || 0) === rodadaAtual;

  await set(minhaPresencaRef, {
    nome: campoNome.value,
    votou: votou,
    rodada: rodadaAtual,
    online: true
  });
  if (geracao !== geracaoSala) return;


}



/* =========================================
   MONITORAR VOTOS
========================================= */

function observarVotos() {
  if (pararObservacaoVotos) {
    pararObservacaoVotos();
    pararObservacaoVotos = null;
  }

  if (!revelado) {
    votos = {};
    atualizarListaParticipantes();
    return;
  }

  pararObservacaoVotos = onValue(votosRef, snapshot => {
    votos = snapshot.val() || {};

    if (uid && votos[uid]) {
      votoAtual = votos[uid].voto;
    } else {
      votoAtual = null;
    }

    atualizarOpcoes();
    atualizarStatus();
    atualizarListaParticipantes();
    calcularResultados();
  }, erro => {
    console.error("Erro ao carregar votos:", erro);
    statusDiv.textContent = "Erro ao carregar os votos.";
  });
}


/* =========================================
   MONITORAR ESTADO DA VOTAÇÃO
========================================= */


/* =========================================
   MONITORAR ESTADO DA VOTAÇÃO
========================================= */

function observarEstado() {

  pararObservacaoEstado = onValue(estadoRef, snapshot => {

    const estavaRevelado = revelado;
    revelado = snapshot.val() === true;

    if (revelado !== estavaRevelado) {
      observarVotos();
    }

    atualizarOpcoes();

    atualizarStatus();

    atualizarListaParticipantes();

    if (revelado) {

      calcularResultados();

    } else {

      resultadosDiv.style.display =
        "none";

    }

  });

}


function observarRodada() {
  pararObservacaoRodada = onValue(rodadaRef, snapshot => {
    const novaRodada = Number(snapshot.val() || 0);

    if (novaRodada !== rodadaAtual) {
      rodadaAtual = novaRodada;
      votoAtual = null;
      votos = {};
      atualizarOpcoes();
      resultadosDiv.style.display = "none";
    }

    atualizarListaParticipantes();
    atualizarStatus();
  });
}


/* =========================================
   MONITORAR PARTICIPANTES ONLINE
========================================= */

function observarParticipantes() {

  pararObservacaoParticipantes = onValue(presencaRef, snapshot => {

    participantes =
      snapshot.val() || {};

    atualizarListaParticipantes();

    atualizarStatus();

  });

}


/* =========================================
   ATUALIZAR LISTA DE PARTICIPANTES
========================================= */

function atualizarListaParticipantes() {

  listaParticipantes.innerHTML = "";

  const lista = Object.entries(participantes)
    .map(([id, dados]) => {

      let exibicaoVoto = "⬜";

      if (revelado) {

        const voto =
          votos[id]?.voto;

        exibicaoVoto =
          voto !== undefined ? voto : "⬜";

      } else {

        exibicaoVoto =
          dados.votou === true && Number(dados.rodada || 0) === rodadaAtual
            ? "✅"
            : "⬜";

      }

      return {

        id: id,

        nome: dados.nome || "Anônimo",

        voto: exibicaoVoto

      };

    })
    .sort((a, b) =>
      a.nome.localeCompare(b.nome, "pt-BR")
    );

  if (lista.length === 0) {

    listaParticipantes.innerHTML =
      '<div class="sem-participantes">Nenhum participante online</div>';

    return;

  }

  lista.forEach(participante => {

    const linha =
      document.createElement("div");

    linha.className =
      "participante";

    const nome =
      document.createElement("span");

    nome.className =
      "participante-nome";

    nome.textContent =
      `${participante.voto} ${participante.nome}`;

    linha.appendChild(nome);

    listaParticipantes.appendChild(linha);

  });

}


/* =========================================
   ATUALIZAR STATUS
========================================= */

function atualizarStatus() {

  const quantidadeVotos =
    Object.values(participantes)
      .filter(p => p.votou === true && Number(p.rodada || 0) === rodadaAtual)
      .length;

  const quantidadeOnline =
    Object.keys(participantes).length;

  if (revelado) {

    statusDiv.textContent =
      `Votação revelada. ${quantidadeOnline} participante(s) online.`;

  } else {

    statusDiv.textContent =
      `Votação secreta. ${quantidadeVotos} voto(s) de ${quantidadeOnline} participante(s) online.`;

  }

}


/* =========================================
   MOSTRAR RESULTADOS
========================================= */

botaoMostrar.addEventListener("click", async () => {

  if (!conectado) return;

  try {

    await set(estadoRef, true);

  } catch (erro) {

    console.error(erro);

    statusDiv.textContent =
      "Erro ao revelar os resultados.";

  }

});


/* =========================================
   LIMPAR RESULTADOS E REINICIAR
========================================= */

botaoLimpar.addEventListener("click", async () => {

  if (!conectado) return;

  const confirmar = confirm(
    "Deseja apagar todos os votos e reiniciar a votação?"
  );

  if (!confirmar) return;

  try {
    // Nova rodada invalida os indicadores antigos sem alterar
    // os registros de presença dos demais participantes.
    const proximaRodada = rodadaAtual + 1;

    await Promise.all([
      set(votosRef, null),
      set(estadoRef, false),
      set(rodadaRef, proximaRodada)
    ]);

    votoAtual = null;
    votos = {};
    revelado = false;
    atualizarOpcoes();
    resultadosDiv.style.display = "none";

  } catch (erro) {
    console.error("Erro ao limpar:", erro);
    statusDiv.textContent = "Erro ao reiniciar a votação.";
  }

});


/* =========================================
   CALCULAR RESULTADOS
========================================= */

function arredondarParaFibonacci(media) {
  const sequencia = [1, 2, 3, 5, 8, 13, 21, 34, 55];

  if (media === 5) return 5;

  if (media > 5) {
    return sequencia.find(numero => numero >= media) ?? 55;
  }

  // Abaixo de 5: menor distância; em empate, escolhe o maior.
  return sequencia.reduce((melhor, atual) => {
    const distanciaAtual = Math.abs(atual - media);
    const distanciaMelhor = Math.abs(melhor - media);

    if (distanciaAtual < distanciaMelhor) return atual;
    if (distanciaAtual === distanciaMelhor && atual > melhor) return atual;
    return melhor;
  });
}

function calcularResultados() {
  const numericos = Object.values(votos)
    .map(item => Number(item.voto))
    .filter(numero => Number.isFinite(numero));

  resultadosDiv.style.display = "block";

  if (numericos.length === 0) {
    resultadoArredondadoDiv.textContent =
      "Resultado da Votação: sem votos numéricos";
    mediaDiv.textContent = "Média da Votação: --";
    return;
  }

  const soma = numericos.reduce((total, numero) => total + numero, 0);
  const media = soma / numericos.length;
  const resultado = arredondarParaFibonacci(media);

  resultadoArredondadoDiv.textContent =
    `Resultado da Votação: ${resultado}`;

  mediaDiv.textContent =
    `Média da Votação: ${media.toLocaleString("pt-BR", {
      maximumFractionDigits: 4
    })}`;
}
